# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# ---------------------------------------------------------------------------
# 站点设置 —— 会用于浏览器标题、SEO 描述和侧边栏
# ---------------------------------------------------------------------------
title                    : "Ningfeng Que (阙宁峰)"
description              : "Ph.D. Student at Peking University. Working on spatial transcriptomics, computational pathology and medical image analysis."
# 改成你自己的 GitHub 仓库（格式：用户名/仓库名）。
# 这一步很关键：Google Scholar 引用数据的自动更新靠这个值拼接数据地址。
repository               : "queningfeng/queningfeng.github.io"

# true  = 通过 jsDelivr CDN 读取引用数据（国内访问更快，推荐）
# false = 直接读 raw.githubusercontent.com（CDN 缓存没刷新时可用）
google_scholar_stats_use_cdn : true

# 谷歌学术作者 ID：你主页链接里 user= 后面那一串
google_scholar_id        : "ZxrkoP4AAAAJ"

# google analytics（可选）
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO 站长验证（可选）
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # get bing_site_verification from https://www.bing.com/webmasters/about
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

# ---------------------------------------------------------------------------
# 作者信息 —— 侧边栏头像下方那一串链接都由这里生成
# ---------------------------------------------------------------------------
author:
  name             : "Ningfeng Que"
  avatar           : "images/avatar.jpg"
  bio              : "Ph.D. Student, Peking University"
  location         : "Beijing, China"
  employer         : "State Key Laboratory of Natural and Biomimetic Drugs"
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=ZxrkoP4AAAAJ"
  email            : "YOUR_EMAIL@stu.pku.edu.cn"   # TODO 必改：换成你的真实邮箱
  researchgate     :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "queningfeng"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  dblp             : "https://dblp.org/search?q=Ningfeng+Que"
  orcid            : "https://orcid.org/0009-0000-1790-1241"
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - tools
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
