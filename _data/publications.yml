# 论文列表 —— 主页的 Publications 一栏由这个文件驱动。
# 新增一篇论文 = 在下面加一条，不用碰 HTML。
#
# 字段：
#   group        first（一作/共同一作）| collaborative（合作）
#   badge        左图左上角的小徽章（短标签）
#   venue_full   期刊/会议**全称**，页面上加粗
#   venue_extra  补充说明（Early Accept 之类），可省略
#   title        论文标题，加粗并作为链接文字
#   url          链接；留空则只显示粗体标题
#   authors_html 作者列表（HTML）：<strong> 加粗，<sup>†</sup> 共同一作，<sup>✉</sup> 通讯作者
#   note         一句话说明
#   figure       框架图（images/papers/ 下）
#   links        额外链接（HTML），可省略
#
# 图例：† 共同一作（equal contribution）　✉ 通讯作者（corresponding author）
#
# ===========================================================================
# 共同一作 / 通讯作者的核实情况（逐个 PDF 首页的作者行读出）
#   每行末尾的符号就是论文自己标的，不是我推断的。
#
#   C2-STi        Que^{1,2,*}, Wang^{3,*}          -> 共一 2 人；通讯 Chao Li^{✉}
#   StateXDiff    Shi^{1,†}, Que^{1,†}             -> 共一 2 人；通讯 Xi^{1,*}
#   FOCUS         Wang^{1†}; Que^{2†}; Liu^{3†}    -> 共一 3 人；
#                 末尾 Xi^{2†}; Wang^{6†}; Li^{1,3,7,8†} -> 共同通讯 3 人
#   HARMONIC      Wang^{1†}; Tao^{1†}; Jiang^{2†}  -> 共一 3 人；
#                 末尾 Qian^{8†}; Xu^{2†}; Li^{1,4,7,8†}  -> 共同通讯 3 人
#   IJCAI 2024    Wang^{1,&}, Liu^{1,&}            -> 共一 2 人；通讯 Xin^{2,*}
#   DesTrans      Song^{a} 唯一一作                 -> 通讯 Dai^{a,b,*}
#   Hydrogel      Li 唯一一作                       -> "Correspondence: Ye Tian"
#   VTCNet        论文作者行**没有**共一标记         -> "Correspondence: Yin Dai"
#   OncoRelay3D   Li 唯一一作                       -> 通讯 Li^{2,5,6,7,*}
#
#   ⚠️ 三处与论文标注不一致，需要你确认（我暂按你说的"是共同一作"处理）：
#     1. CoInS-Net：arXiv 作者行只有 Yin Dai^{*,✉}，没有共一符号
#     2. VTCNet  ：Wiley 作者行没有共一符号，只写了 Correspondence: Yin Dai
#     3. MLAR-UNet：第 1 页是 IOP 封面页，看不到作者块。
#                  通讯作者我按"末位作者"暂填 Yueyang Teng —— 请核对
# ===========================================================================

