# 论文列表 —— 主页的 Publications 一栏由这个文件驱动。
# 新增一篇论文 = 在下面加一条，不用碰 HTML。
#
# 字段：
#   topic        分类（决定放在哪一节下）：
#                  st      空间转录组与计算病理
#                  vcell   虚拟细胞扰动建模
#                  imaging 医学图像分析
#                  other   其他合作
#   date         "YYYY-MM-DD" 或 "YYYY-MM"。**组内按它倒序排列**（新的在前）。
#   role         作者角色，显示在期刊名后面：First author / Co-first author / Co-author
#   badge        左图左上角的小徽章（短标签）
#   venue_full   期刊/会议**全称**，页面上加粗
#   venue_extra  补充说明（Early Accept 之类），可省略
#   title        论文标题，加粗并作为链接文字
#   url          论文链接；留空则只显示粗体标题
#   authors_html 作者列表（HTML）：<strong> 加粗，<sup>†</sup> 共同一作，<sup>✉</sup> 通讯作者
#   note         一句话说明
#   figure       框架图（images/papers/ 下）
#   links        额外链接（HTML）；有公开代码的论文都写了 github 地址
#   citation_titles  可选。预印本改名后 Google Scholar 还挂旧标题时，把旧标题写在这里，
#                    引用数照样能匹配上（页面上显示的仍是新标题）。
#
# 图例：† 共同一作（equal contribution）　✉ 通讯作者（corresponding author）
#
# ===========================================================================
# 共同一作 / 通讯作者的核实情况（逐个 PDF 首页的作者行读出，并与 Google Scholar 对照）
#
#   C2-STi        Que^{1,2,*}, Wang^{3,*}          -> 共一 2 人；通讯 Chao Li^{✉}
#   StateXDiff    Shi^{1,†}, Que^{1,†}             -> 共一 2 人；通讯 Xi^{1,*}
#   FOCUS         Wang^{1†}; Que^{2†}; Liu^{3†}    -> 共一 3 人；
#                 末尾 Xi^{2†}; Wang^{6†}; Li^{1,3,7,8†} -> 共同通讯 3 人
#   HARMONIC      Wang^{1†}; Tao^{1†}; Jiang^{2†}  -> 共一 3 人；
#                 末尾 Qian^{8†}; Xu^{2†}; Li^{1,4,7,8†}  -> 共同通讯 3 人
#   CoInS-Net     arXiv 作者行无共一符号，但 Google Scholar 与作者本人均确认是共一
#   IJCAI 2024    Wang^{1,&}, Liu^{1,&}            -> 共一 2 人；通讯 Xin^{2,*}
#   VTCNet        PDF 作者行无共一符号，但 Google Scholar 写作 "Mingzhe Li†, Ningfeng Que†"
#   MLAR-UNet     PDF 第 1 页是 IOP 封面页看不到作者块；Scholar 写作 "Hao Tang†, Ningfeng Que†"
#                 通讯作者按末位作者填 Yueyang Teng
#   DesTrans      Song 唯一一作 -> 通讯 Dai^{a,b,*}
#   Hydrogel      Li 唯一一作   -> "Correspondence: Ye Tian"
#   OncoRelay3D   Li 唯一一作   -> 通讯 Li^{2,5,6,7,*}
#
# 代码仓库来源：PDF / arXiv 正文里写的 "code is available at"，或按标题在 GitHub 搜到、
# 并与一作账号名对得上（haot2025 = Hao Tang、LHY1007 = Hanyu Liu）。
# 没有找到公开代码的论文（CoInS-Net、StateXDiff、HARMONIC、IJCAI、DesTrans、Hydrogel）不写 links。
# ===========================================================================

